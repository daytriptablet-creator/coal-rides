name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Apply update files
        run: |
          set -e
          find . -type d -path '*/src/main/java' -not -path './coal-rides/*' | while read d; do
            echo "$(git log -1 --format=%ct -- "$d") $d"
          done | sort -n | cut -d' ' -f2- > updates.txt
          cat updates.txt
          test -s updates.txt
          find coal-rides -type d -path '*/src/main/java' > targets.txt
          cat targets.txt
          while read u; do
            while read t; do
              cp -r "$u"/. "$t"/
            done < targets.txt
          done < updates.txt
          grep -rq stored_fuel coal-rides --include=CoalRides.java
      - name: Build
        run: |
          cd "$(dirname "$(find . -name build.gradle | head -1)")"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: coal-rides-mod
          path: "**/build/libs/*.jar"
